# Include inside the existing HTTPS server block for conscient.hk.cn.
# Files: /var/www/zju-cantonese-duolingo/index.html, game.js, assets/, ...
location = /yue {
    return 301 /yue/;
}

location ^~ /yue/ {
    alias /var/www/zju-cantonese-duolingo/;
    index index.html;
    autoindex off;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    expires -1;
}
